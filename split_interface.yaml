---
- name: Split interface.yml em arquivos por instância
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Carregar interface.yml
      set_fact:
        interface: "{{ lookup('file', 'interface.yml') | from_yaml }}"

    - name: Garantir que resources/ existe
      file:
        path: resources
        state: directory

    - name: Montar lista de instâncias (tipo + chave)
      set_fact:
        instances: >-
          {%- set result = [] -%}
          {%- for tipo in interface.keys() -%}
            {%- for chave in interface[tipo].keys() -%}
              {%- set _ = result.append({'tipo': tipo, 'chave': chave}) -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ result }}

    - name: Calcular nomes de arquivo esperados
      set_fact:
        expected_basenames: >-
          {%- set result = [] -%}
          {%- for i in instances -%}
            {%- set _ = result.append(i.tipo ~ '_' ~ i.chave ~ '.yml') -%}
          {%- endfor -%}
          {{ result }}

    - name: Escrever um arquivo por instância em resources/
      copy:
        dest: "resources/{{ item.tipo }}_{{ item.chave }}.yml"
        content: "{{ {item.chave: interface[item.tipo][item.chave]} | to_nice_yaml }}"
      loop: "{{ instances }}"
      loop_control:
        label: "{{ item.tipo }}_{{ item.chave }}"

    - name: Listar arquivos existentes em resources/
      find:
        paths: resources/
        patterns: "*.yml"
      register: existing_files

    - name: Remover arquivos de instâncias que não existem mais no interface.yml
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ existing_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: (item.path | basename) not in expected_basenames
