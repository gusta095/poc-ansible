---
- name: Deploy infraestrutura orientado a mudanças (por instância)
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    # Uso local/dev: compara o working tree com o último commit (HEAD),
    # então também pega mudanças ainda não commitadas.
    #
    # Ainda não existe pipeline de CI neste lab. Quando existir, a lógica
    # muda pra `git diff HEAD~1 HEAD` (commit vs commit)
    - name: Detectar mudanças em resources/ (working tree vs HEAD)
      command: git status --porcelain --untracked-files=all -- resources/
      register: git_status
      changed_when: false

    # Formato de cada linha do `git status --porcelain`: "XY caminho"
    #   X = status no index, Y = status no working tree
    #   exemplos: " M" (modificado), "??" (novo), " D" (deletado)
    #
    # changed_files = linhas sem "D" em X ou Y (adicionado/modificado)
    # removed_files = linhas com "D" em X ou Y (deletado)
    #
    # regex_replace('^.{3}', '') descarta "XY " e deixa só o caminho
    - name: Separar arquivos alterados/novos dos removidos
      set_fact:
        changed_files: "{{ git_status.stdout_lines | reject('match', '^.?D') | map('regex_replace', '^.{3}', '') | list }}"
        removed_files: "{{ git_status.stdout_lines | select('match', '^.?D') | map('regex_replace', '^.{3}', '') | list }}"

    # resource_type = nome do arquivo sem o sufixo "_chave"
    #   ex: storage_accounts_stpocansible001.yml -> storage_accounts
    #   usado para escolher a task create_{{resource_type}}.yml no role azure
    - name: Deploy das instâncias alteradas/novas
      include_role:
        name: azure
        tasks_from: "create_{{ resource_type }}"
      vars:
        resource_data: "{{ lookup('file', item) | from_yaml }}"
        resource_type: "{{ (item | basename | splitext)[0] | regex_replace('_[^_]+$', '') }}"
        deployment_name: "{{ (item | basename | splitext)[0] | replace('_', '-') }}"
      loop: "{{ changed_files }}"
      loop_control:
        label: "{{ item }}"

    # O arquivo já não existe no working tree, então o conteúdo vem do
    # último commit (`git show HEAD:path`) em vez de lookup('file', ...).
    # stack_state: absent é repassado pro role, que usa como `state` no
    # azure_rm_resourcegroup/azure_rm_deployment pra destruir o recurso.
    - name: Destroy das instâncias removidas
      include_role:
        name: azure
        tasks_from: "create_{{ resource_type }}"
      vars:
        resource_data: "{{ lookup('pipe', 'git show HEAD:' ~ item) | from_yaml }}"
        resource_type: "{{ (item | basename | splitext)[0] | regex_replace('_[^_]+$', '') }}"
        deployment_name: "{{ (item | basename | splitext)[0] | replace('_', '-') }}"
        stack_state: absent
      loop: "{{ removed_files }}"
      loop_control:
        label: "{{ item }}"
