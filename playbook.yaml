---
- name: Deploy infraestrutura orientado a mudanças (por instância)
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    # ── 1. Carregar as duas versões do interface.yml ──
    # interface_atual = working tree (o que está declarado agora)
    # interface_head  = a última versão commitada (baseline pra comparar)
    - name: Carregar interface.yml (working tree)
      set_fact:
        interface_atual: "{{ lookup('file', 'interface.yml') | from_yaml }}"

    - name: Carregar interface.yml (HEAD)
      command: git show HEAD:interface.yml
      register: interface_head_raw
      changed_when: false
      failed_when: false

    # rc != 0 quando o interface.yml ainda não existia no HEAD (primeiro
    # commit) — trata como vazio, ou seja, tudo em interface_atual é novo.
    - name: Parsear interface.yml (HEAD)
      set_fact:
        interface_head: "{{ (interface_head_raw.stdout | from_yaml) if interface_head_raw.rc == 0 else {} }}"

    # ── 2. Listar instâncias (tipo + chave) de cada versão ──
    - name: Montar instâncias do interface atual
      set_fact:
        instances_atual: >-
          {%- set result = [] -%}
          {%- for tipo in interface_atual.keys() -%}
            {%- for chave in interface_atual[tipo].keys() -%}
              {%- set _ = result.append({'tipo': tipo, 'chave': chave}) -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ result }}

    - name: Montar instâncias do interface no HEAD
      set_fact:
        instances_head: >-
          {%- set result = [] -%}
          {%- for tipo in interface_head.keys() -%}
            {%- for chave in interface_head[tipo].keys() -%}
              {%- set _ = result.append({'tipo': tipo, 'chave': chave}) -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ result }}

    # ── 3. Comparar as duas versões pra achar o que mudou/sumiu ──
    # changed_instances = está no atual e (não existia no HEAD OU o
    # conteúdo é diferente do HEAD)
    # removed_instances = existia no HEAD e não está mais no atual
    - name: Separar instâncias alteradas/novas das removidas
      set_fact:
        changed_instances: >-
          {%- set result = [] -%}
          {%- for i in instances_atual -%}
            {%- if i not in instances_head or interface_atual[i.tipo][i.chave] != interface_head[i.tipo][i.chave] -%}
              {%- set _ = result.append(i) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ result }}
        removed_instances: >-
          {%- set result = [] -%}
          {%- for i in instances_head -%}
            {%- if i not in instances_atual -%}
              {%- set _ = result.append(i) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ result }}

    # ── 4. Deploy das instâncias alteradas/novas ──
    - name: Deploy das instâncias alteradas/novas
      include_role:
        name: azure
        tasks_from: "create_{{ item.tipo }}"
      vars:
        resource_data: "{{ {item.chave: interface_atual[item.tipo][item.chave]} }}"
        deployment_name: "{{ (item.tipo ~ '_' ~ item.chave) | replace('_', '-') }}"
      loop: "{{ changed_instances }}"
      loop_control:
        label: "{{ item.tipo }}_{{ item.chave }}"

    # ── 5. Destroy das instâncias removidas ──
    # resource_data vem do interface_head (o conteúdo já não existe no
    # atual). stack_state: absent vira `state: absent` no role, que
    # destrói o recurso na Azure.
    - name: Destroy das instâncias removidas
      include_role:
        name: azure
        tasks_from: "create_{{ item.tipo }}"
      vars:
        resource_data: "{{ {item.chave: interface_head[item.tipo][item.chave]} }}"
        deployment_name: "{{ (item.tipo ~ '_' ~ item.chave) | replace('_', '-') }}"
        stack_state: absent
      loop: "{{ removed_instances }}"
      loop_control:
        label: "{{ item.tipo }}_{{ item.chave }}"
