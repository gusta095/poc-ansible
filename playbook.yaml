---
- name: Deploy infraestrutura orientado a mudanças (por instância)
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Detectar mudanças em resources/ (working tree vs HEAD)
      command: git status --porcelain --untracked-files=all -- resources/
      register: git_status
      changed_when: false

    - name: Separar arquivos alterados/novos dos removidos
      set_fact:
        changed_files: >-
          {%- set result = [] -%}
          {%- for line in git_status.stdout_lines -%}
            {%- if line[0:2] not in [' D', 'D ', 'D'] -%}
              {%- set _ = result.append(line[3:]) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ result }}
        removed_files: >-
          {%- set result = [] -%}
          {%- for line in git_status.stdout_lines -%}
            {%- if line[0:2] in [' D', 'D ', 'D'] -%}
              {%- set _ = result.append(line[3:]) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ result }}

    - name: Deploy das instâncias alteradas/novas
      include_role:
        name: azure
        tasks_from: "create_{{ resource_type }}"
      vars:
        resource_data: "{{ lookup('file', item) | from_yaml }}"
        resource_type: "{{ (item | basename | splitext)[0] | regex_replace('_[^_]+$', '') }}"
        deployment_name: "{{ (item | basename | splitext)[0] | replace('_', '-') }}"
      loop: "{{ changed_files }}"
      loop_control:
        label: "{{ item }}"

    - name: Destroy das instâncias removidas
      include_role:
        name: azure
        tasks_from: "create_{{ resource_type }}"
      vars:
        resource_data: "{{ lookup('pipe', 'git show HEAD:' ~ item) | from_yaml }}"
        resource_type: "{{ (item | basename | splitext)[0] | regex_replace('_[^_]+$', '') }}"
        deployment_name: "{{ (item | basename | splitext)[0] | replace('_', '-') }}"
        stack_state: absent
      loop: "{{ removed_files }}"
      loop_control:
        label: "{{ item }}"
